            <div class="container-header-company">
                <button class="toggle-btn" aria-label="Alternar menu" title="Alternar menu">
                    <i class='bx  bx-menu'></i>
                </button>

                    <img src="../../../assets/logotipo/logotipo-airwise-pad-white.png" alt="">
                </div>
            </div>

            <div class="brand">
                <div class="brand-avatar">
                    <img src="https://images.vexels.com/media/users/3/137047/isolated/preview/5831a17a290077c646a48c4db78a81bb-icone-azul-do-perfil-de-usuario.png"
                        alt="">
                </div>
                <div class="brand-text">
                    <h3 id="nome_usuario"></h3>
                    <p id="cargo_usuario"></p>
                </div>
            </div>
        </header>

        <nav class="menu" role="navigation" aria-label="Menu principal">
            <a href="../dashboard/dash-geral/dash-main.html">
                <button class="menu-btn" aria-pressed="true">
                    <i class="bx bx-home"></i>

            <a href="../dashboard/dash-reclamacoes/dash-reclamacoes.html">

                </button>
            </a>

            <a href="../dashboard/dash-marketing-company/dash-marketing-company.html">
                <button class="menu-btn">
                    <i class="bx bx-line-chart"></i>
                    <p class="label">Desempenho Interno</p>
                </button>
            </a>

            <a href="../dashboard/dash-benchmark/dash-benchmark.html">
                <button class="menu-btn active">
                    <i class="bx bx-line-chart"></i>
                    <p class="label">Benchmark</p>
                </button>
            </a>

            <a href="../CRUD/gestao_usuario.html">
                <button class="menu-btn">
                    <i class='bx  bx-user' style='color:#ffffff'></i>
                    <p class="label">Gestão de Usuários</p>
                </button>
            </a>

            <a href="../../suporte/suporte.html">

        <footer class="footer-sidebar">
            <div class="footer-actions">

                    </button>
                </a>
            </div>
        </footer>

    <main role="main" aria-label="Conteúdo principal">
    <header class="header" role="banner" aria-label="Barra superior do painel">
        <div class="header-left">
            <h1 class="page-title">Meus Tickets</h1>
            <p class="subtitle">Crie e veja seus chamados</p>
        </div>

        <button class="btn-novo" onclick="abrirModal('modalNovoTicket')">+ Novo Chamado</button>
    </header>

    <div class="ticket-board">
        </div>
</main>

<div id="modalNovoTicket" class="modal hidden">
    <div class="container">
        <div class="form-box">
            <h2>Novo Chamado</h2>
            <form id="formNovoTicket">
                
                <div>
                    <label for="titulo_ticket">Título do Problema</label>
                    <input type="text" id="titulo_ticket" placeholder="Resumo curto do problema" required />
                </div>

                <div>
                    <label for="categoria_ticket">Categoria</label>
                    <select id="categoria_ticket" required>
                        <option value="" disabled selected>Selecione a categoria</option>
                        <option value="Acesso/Login">Problemas de Acesso/Login</option>
                        <option value="Dashboard">Erro na Dashboard</option>
                        <option value="Dados incorretos">Dados Incorretos</option>
                        <option value="Lentidao">Lentidão no Sistema</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div>
                    <label for="impacto_ticket">Impacto</label>
                    <select id="impacto_ticket" required>
                        <option value="" disabled selected>Selecione o impacto</option>
                        <option value="Baixa">Baixa (Não impede o uso)</option>
                        <option value="Media">Média (Dificulta o uso)</option>
                        <option value="Alta">Alta (Sistema parado)</option>
                    </select>
                </div>

                <div>
                    <label for="descricao_ticket">Descrição Detalhada</label>
                    <textarea id="descricao_ticket" rows="5" placeholder="Descreva o que aconteceu..." required style="width: 100%; padding: 10px; border: 1px solid #cfd2d8; border-radius: 8px; resize: vertical;"></textarea>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" class="btn-azul" style="flex: 1;">Criar Ticket</button>
                    <button type="button" class="btn-cinza" style="flex: 1;" onclick="fecharModal('modalNovoTicket')">Cancelar</button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="suporte.js"></script>

</html>
